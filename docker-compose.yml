services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: patient_reg
      POSTGRES_PASSWORD: patient_reg_secret
      POSTGRES_DB: patient_registration
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patient_reg -d patient_registration"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
